name: AtxCloud CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: atxcloud-control-plane
        run: npm install
      - name: Build API
        working-directory: atxcloud-control-plane
        run: npm run build:api
      - name: Build bot
        working-directory: atxcloud-control-plane
        run: npm run build:bot
      - name: Build dashboard
        working-directory: atxcloud-control-plane
        run: npm run build:web
      - name: Validate schema SQL
        working-directory: atxcloud-control-plane
        run: |
          docker run --rm -i postgres:17-alpine psql -v ON_ERROR_STOP=1 -U postgres -d postgres < prisma/schema.sql >/dev/null
